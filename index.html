<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纯HTML · 极简页面</title>
  <!-- 纯HTML结构，内嵌CSS样式，无外部依赖 -->
  <style>
    /* 全局重置与设计系统 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f9faff 0%, #eef1f9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e1e2f;
      line-height: 1.5;
    }

    /* 主卡片 —— 纯净、圆润、柔和阴影 */
    .card {
      max-width: 780px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 3rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 
        0 25px 45px -12px rgba(0, 10, 30, 0.15),
        0 2px 10px 0 rgba(0, 0, 0, 0.02),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.25s ease;
      text-align: center;
    }

    /* 头像圆形装饰 */
    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.6rem;
      background: linear-gradient(135deg, #3b3b5c, #2a2a44);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 18px -6px rgba(0, 0, 0, 0.2), inset 0 -3px 0 rgba(0,0,0,0.1);
      border: 3px solid white;
    }

    .avatar span {
      font-size: 3.5rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    /* 主标题 */
    h1 {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      background: linear-gradient(145deg, #1a1a2e, #2f2f4a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    /* 副标题/角色 */
    .subhead {
      font-size: 1.2rem;
      font-weight: 400;
      color: #5b5b7a;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .subhead::before,
    .subhead::after {
      content: "";
      height: 1px;
      width: 35px;
      background: linear-gradient(to right, transparent, #b9b9d4, transparent);
    }

    /* 描述段落 */
    .description {
      font-size: 1.08rem;
      color: #2d2d44;
      max-width: 550px;
      margin: 0 auto 2.2rem;
      padding: 0 0.5rem;
      font-weight: 380;
      border-left: 3px solid #c0c6e0;
      border-right: 3px solid #c0c6e0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 0;
      padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    /* 技能标签——纯装饰性但无JS，显示HTML/CSS能力 */
    .skill-badge {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2.4rem;
    }

    .skill-badge span {
      background: white;
      padding: 0.6rem 1.35rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #252538;
      box-shadow: 0 5px 12px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
      border: 1px solid #d9def0;
      transition: transform 0.15s ease, box-shadow 0.2s;
      letter-spacing: 0.01em;
    }

    .skill-badge span:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 18px -8px rgba(55, 55, 100, 0.2), 0 0 0 1px white inset;
      border-color: #b6bde0;
    }

    /* 按钮区域——伪交互（hover/cursor） */
    .action-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 0.8rem;
    }

    .btn {
      display: inline-block;
      background: #1e1e2f;
      color: white;
      text-decoration: none;
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 18px -8px rgba(0, 0, 0, 0.25), 0 4px 8px -2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      cursor: pointer;
      background-image: linear-gradient(135deg, #26263d, #14141f);
    }

    .btn:hover {
      background-image: linear-gradient(135deg, #2d2d4a, #1a1a2b);
      transform: translateY(-3px);
      box-shadow: 0 22px 28px -10px rgba(20, 20, 50, 0.4), 0 6px 12px -4px rgba(0, 0, 0, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 8px 15px -6px rgba(0, 0, 0, 0.3);
      transition: all 0.05s;
    }

    /* 次要按钮风格 */
    .btn-outline {
      background: transparent;
      background-image: none;
      color: #1e1e2f;
      border: 1.5px solid #b9bfda;
      box-shadow: 0 6px 12px -8px rgba(0, 0, 0, 0.1);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.8);
      background-image: none;
      border-color: #8d94bb;
      color: #12121f;
      box-shadow: 0 18px 25px -12px rgba(50, 50, 100, 0.2);
      transform: translateY(-3px);
    }

    /* 页脚小字 */
    .footnote {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #6d6d8a;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-top: 1px solid rgba(160, 160, 200, 0.2);
      padding-top: 1.6rem;
      width: 100%;
    }

    .footnote .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #9a9ac0;
      border-radius: 50%;
      opacity: 0.7;
    }

    /* 完全响应式调整 */
    @media (max-width: 540px) {
      body {
        padding: 0.8rem;
      }

      .card {
        padding: 2rem 1.5rem;
        border-radius: 2.2rem;
      }

      h1 {
        font-size: 2rem;
      }

      .avatar {
        width: 85px;
        height: 85px;
        margin-bottom: 1.2rem;
      }

      .avatar span {
        font-size: 2.8rem;
      }

      .description {
        font-size: 1rem;
        padding: 0.8rem;
        margin-bottom: 1.8rem;
      }

      .btn {
        padding: 0.8rem 1.6rem;
        font-size: 1rem;
      }

      .skill-badge span {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
      }

      .footnote {
        margin-top: 1.8rem;
        font-size: 0.78rem;
      }
    }

    /* 减少动态效果偏好支持 */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* 专注可见 outline 可访问性 (但不破坏设计) */
    .btn:focus-visible,
    .skill-badge span:focus-visible {
      outline: 3px solid #3b3b80;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <!-- 整个页面只有一个简洁卡片，语义化header/section/footer -->
  <main class="card" role="main">
    <!-- 装饰头像 / 纯文本首字母 -->
    <div class="avatar" aria-hidden="true">
      <span>H</span>
    </div>

    <header>
      <h1>Hello, 世界</h1>
      <div class="subhead">纯HTML · 零JavaScript</div>
    </header>

    <!-- 描述文字 -->
    <p class="description">
      这是一个完全由HTML和CSS构建的页面。没有使用任何JavaScript、外部字体或库，所有样式均内嵌，轻量、自包含且优雅。
    </p>

    <!-- 技能标签（静态展示） -->
    <div class="skill-badge" role="list" aria-label="技术特性">
      <span role="listitem">🌐 语义化标签</span>
      <span role="listitem">🎨 内联CSS</span>
      <span role="listitem">📱 响应式</span>
      <span role="listitem">✨ 柔光效果</span>
      <span role="listitem">♿ 可访问性</span>
    </div>

    <!-- 纯样式按钮 (无实际链接/JS，仅视觉交互) -->
    <div class="action-group">
      <a href="#" class="btn" role="button" aria-label="了解更多（示意按钮）">了解更多</a>
      <a href="#" class="btn btn-outline" role="button" aria-label="联系我（示意按钮）">联系我</a>
    </div>

    <!-- 底部装饰文字 -->
    <div class="footnote">
      <span>纯HTML页面</span>
      <span class="dot"></span>
      <span>单文件</span>
      <span class="dot"></span>
      <span>无依赖</span>
    </div>
  </main>

  <!-- 额外的纯HTML注释——此页面满足“纯html”要求，无任何脚本，所有交互仅基于CSS -->
  <!-- 页面不使用任何JavaScript, 完全符合纯HTML定义 -->
</body>
</html>
